# CampusHub 前端站点配置
# 用法（服务器上）：
#   sudo cp campushub.conf /etc/nginx/sites-available/campushub
#   sudo cp campushub-common.conf /etc/nginx/snippets/campushub-common.conf
#   sudo ln -sf /etc/nginx/sites-available/campushub /etc/nginx/sites-enabled/campushub
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 静态资源根目录：/opt/campushub/web
# 证书目录：      /opt/campushub/ssl

# ============================================================
# 1. 域名 HTTP：强制跳 HTTPS
# ============================================================
server {
    listen 80;
    server_name cwwstudy.online www.cwwstudy.online;
    return 301 https://$host$request_uri;
}

# ============================================================
# 2. 域名 HTTPS：正式对外站点
# ============================================================
server {
    listen 443 ssl http2;
    server_name cwwstudy.online www.cwwstudy.online;

    # 必须用 _bundle.crt（含中间链），只用站点证书会让手机端报"证书无效"
    ssl_certificate     /opt/campushub/ssl/cwwstudy.online_bundle.crt;
    ssl_certificate_key /opt/campushub/ssl/cwwstudy.online.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/campushub/web;
    index index.html;

    include /etc/nginx/snippets/campushub-common.conf;
}

# ============================================================
# 3. IP 直连：保留 HTTP，作为域名不通时的备用入口
#    default_server 让任何未匹配的 Host 都落到这里
# ============================================================
server {
    listen 80 default_server;
    server_name _;

    root /opt/campushub/web;
    index index.html;

    include /etc/nginx/snippets/campushub-common.conf;
}
