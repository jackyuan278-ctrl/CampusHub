# CampusHub 公共配置（被 HTTP 与 HTTPS 两个 server 共用）
# 抽出来的目的：改一次 location，两个入口同时生效，不会漏改
# 部署位置：/etc/nginx/snippets/campushub-common.conf

charset utf-8;

# 前端产物是 js/css，压缩收益很大（1.27MB -> 413KB）
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# 带 hash 的产物，长缓存
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# 入口文件绝不缓存，否则发版后用户拿到的还是旧入口
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# SPA history 路由兜底：刷新 /secondhand 这类路径不能 404
location / {
    try_files $uri $uri/ /index.html;
}

# 后端网关。
# 关键：proxy_pass 结尾不要加斜杠，保留 /api 前缀原样转给 8080，
#      网关自己配了 StripPrefix=1（/api/users/** -> /users/**）
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # nginx 默认 1MB，会和网关 8MB 的 codec 缓冲不对齐，图片上传直接 413
    client_max_body_size 10m;
}

# Let's Encrypt / 证书验证路径必须放行，别被下面的 deny 规则误伤
location ^~ /.well-known/ {
    allow all;
    access_log off;
}

# 禁止访问点开头的敏感文件
location ~ /\.(env|git) {
    deny all;
}
