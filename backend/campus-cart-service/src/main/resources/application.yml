server:
  port: 8083
spring:
  application:
    name: campus-cart-service
  # zg-cart 无数据库（纯 Redis），需排除 zg-common 传递引入的 JDBC 自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:124.220.155.27:8848}
  data:
    redis:
      host: ${REDIS_HOST:124.220.155.27}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
campus:
  jwt:
    secret: ${JWT_SECRET:campushub-jwt-secret-placeholder-32bytes-min}
    ttl: 1800000
logging:
  level:
    com.campushub: debug




