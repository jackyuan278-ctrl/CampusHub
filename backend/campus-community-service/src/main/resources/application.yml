server:
  port: 8091

spring:
  application:
    name: campus-community-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:124.220.155.27:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接值一律占位：真实 IP/密码走 application-dev.yml（已 gitignore）或环境变量
    url: jdbc:mysql://${MYSQL_HOST:124.220.155.27}:${MYSQL_PORT:3306}/${MYSQL_DB:campushub_community}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:124.220.155.27}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123}
      database: 3
  # ES 搜索功能未实现前不影响启动；部署 ES 8 后由 dev 配置覆盖地址
  elasticsearch:
    uris: ${ES_URIS:http://124.220.155.27:9200}
  jackson:
    time-zone: Asia/Shanghai

campus:
  jwt:
    # HS256 密钥要求 >= 32 字节；生产用环境变量 JWT_SECRET 注入随机长串
    secret: ${JWT_SECRET:campushub-jwt-secret-placeholder-32bytes-min}
    ttl: 1800000
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

logging:
  level:
    com.campushub.community: debug







