server:
  port: 8090

spring:
  profiles:
    # 本地联调默认走 dev：OSS 密钥等不入库的配置都在 application-dev.yml 里，
    # 该文件被 .gitignore 排除、不进 git。文件不存在时 Spring 只是跳过，不会启动失败。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: campus-activity-service
  # 图片上传：Spring 默认单文件只有 1MB，必须放开
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:124.220.155.27:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接值一律占位：真实 IP/密码走 application-dev.yml（已 gitignore）或环境变量
    url: jdbc:mysql://${MYSQL_HOST:124.220.155.27}:${MYSQL_PORT:3306}/${MYSQL_DB:campushub_activity}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:124.220.155.27}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123}
      database: 3
  # ES 搜索功能未实现前不影响启动；部署 ES 8 后由 dev 配置覆盖地址
  elasticsearch:
    uris: ${ES_URIS:http://124.220.155.27:9200}
  jackson:
    time-zone: Asia/Shanghai

campus:
  jwt:
    # HS256 密钥要求 >= 32 字节；生产用环境变量 JWT_SECRET 注入随机长串
    secret: ${JWT_SECRET:campushub-jwt-secret-placeholder-32bytes-min}
    ttl: 1800000
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

logging:
  level:
    com.campushub.activity: debug
# 图片上传（阿里云 OSS）：密钥不入库，放 application-dev.yml 或用 OSS_AK / OSS_SK 环境变量覆盖
aliyun:
  oss:
    enabled: true
    region: ${OSS_REGION:cn-beijing}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:py-studycww}
    access-key-id: ${OSS_AK:}
    access-key-secret: ${OSS_SK:}








