server:
  port: 8081
spring:
  application:
    name: campus-user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:124.220.155.27:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:124.220.155.27}:3306/campushub_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
campus:
  jwt:
    secret: ${JWT_SECRET:campushub-jwt-secret-placeholder-32bytes-min}
    ttl: 1800000
  internal:
    # 服务间共享密钥，生产必须用环境变量覆盖（与 JWT_SECRET 同源治理）
    token: ${INTERNAL_TOKEN:dev-internal-token}
    # 本服务对外提供的内部接口，只有带密钥的调用方放行
    protected-paths: /users/*/balance/deduct
logging:
  level:
    com.campushub: debug




