server:
  port: 8081
spring:
  profiles:
    # 本地联调默认走 dev：OSS 密钥、真实 MySQL/Redis 账号都只在 application-dev.yml 里，
    # 该文件被 .gitignore 排除、不进 git。文件不存在时 Spring 只是跳过，不会启动失败，
    # 所以生产环境（没有这份文件）也不受影响，需要时用 --spring.profiles.active=prod 覆盖。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: campus-user-service
  # 图片上传：Spring 默认单文件只有 1MB，必须放开
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:124.220.155.27:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:124.220.155.27}:3306/campushub_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
campus:
  jwt:
    secret: ${JWT_SECRET:campushub-jwt-secret-placeholder-32bytes-min}
    ttl: 1800000
  internal:
    # 服务间共享密钥，生产必须用环境变量覆盖（与 JWT_SECRET 同源治理）
    token: ${INTERNAL_TOKEN:dev-internal-token}
    # 本服务对外提供的内部接口，只有带密钥的调用方放行
    # /users/batch 是社区服务补作者信息用的：Feign 直连不经网关，网关那条只挡公网伪造
    protected-paths: /users/*/balance/deduct,/users/*/balance/refund,/users/batch
logging:
  level:
    com.campushub: debug
# 图片上传（阿里云 OSS）：密钥不入库，放 application-dev.yml 或用 OSS_AK / OSS_SK 环境变量覆盖
aliyun:
  oss:
    enabled: true
    region: ${OSS_REGION:cn-beijing}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:py-studycww}
    access-key-id: ${OSS_AK:}
    access-key-secret: ${OSS_SK:}




